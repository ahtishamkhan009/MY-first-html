<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My New Html Project</title>
</head>
<body>
    <header>
        <nav><h1><a href="#">Hi My New Project</a></h1></nav>
    </header><hr>
    <main>
        <section>
            <table border="1" >
                <caption>My Form </caption>
                <tr>
                    <td>
                        <label for="username">username</label>
                    </td>
                    <td>
                        <input type="text" name="username" id="username" placeholder="type username" value="username">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="password">password</label>
                    </td>
                    <td>
                        <input type="password" name="password" id="password">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="gender">Select Gender</label>
                    </td>
                    <td>
                        <label for="male">male</label>
                        <input type="radio" name="gender" id="male" value="male">
                    
                    
                        <label for="female">female</label>
                        <input type="radio" name="gender" id="female" value="female">
                    
                    
                        <label for="other">other</label>
                        <input type="radio" name="gender" id="other" value="other">

                    </td>
                </tr>
                    <tr>
                        <td>
                        <label for="birth">Date of Birth</label>
                        </td>
                        <td>
                            <input type="date" name="date" id="birth">
                        </td>
                    </tr>
                    <tr>
                    <td>
                        <label for="file">File </label>
                    </td>
                    <td>
                        <input type="file" name="file" id="file">
                    </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="country">Select your country</label>
                        </td>
                        <td>
                           <select name="country" id="country">
                            <option value="pakistan">pakistan</option>
                            <option value="us">us</option>
                            <option value="uk">uk</option>
                            <option value="other">other</option>
                           </select>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="email">email</label>
                        </td>
                        <td>
                            <input type="email" name="email" id="email" placeholder="email">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="text">text</label>
                        </td>
                        <td>
                            <textarea name="text" id="text" rows="4" cols="40"></textarea>
                        </td>
                    </tr>

                

            </table>
        </section>
        <section>
            <iframe src="https://www.wikipedia.org/" frameborder="0" width="450" height="200">github</iframe>
        </section>
        <iframe src="https://www.wikipedia.org/" frameborder="0" width="560" height="315" scrolling="no" allowfullscreen></iframe>
    </main>

</body>
</html>
